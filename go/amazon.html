<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Redirecting to Amazon…</title>
<link rel="icon" type="image/png" href="/img/logo.png">
<style>
  *,*::before,*::after { box-sizing: border-box; }
  body { background: #0D1117; color: #E6EDF3; margin: 0; min-height: 100vh;
         display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .box { text-align: center; padding: 24px; }
  .spinner { width: 36px; height: 36px; border: 3px solid #21262D;
             border-top-color: #F7931A; border-radius: 50%;
             animation: spin .8s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; font-weight: 600; margin: 18px 0 6px; letter-spacing: -.2px; }
  p  { font-size: 13px; color: #8B949E; margin: 0; }
  a  { color: #F7931A; text-decoration: none; font-weight: 600; }
  .brand { margin-top: 28px; font-size: 11px; color: #6B7280; letter-spacing: 1.2px; text-transform: uppercase; }
  .brand a { color: #F7931A; }
</style>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js"
        data-cf-beacon='{"token":"6bed19571a144ec699ef127a7e6e8aaa"}'></script>
</head>
<body>
<main class="box">
  <div class="spinner" aria-hidden="true"></div>
  <h1>Redirecting to Amazon…</h1>
  <p>If you aren't redirected, <a id="manual" rel="noopener">click here</a>.</p>
  <p class="brand"><a href="/">BitcoinBrainFood.com</a></p>
</main>
<script>
  var buildUrl = function (params) {
  var asin = params.get('asin');
  if (!asin || !/^[A-Z0-9]{10}$/.test(asin)) return null;
  return 'https://www.amazon.com/dp/' + asin + '?tag=jalinn.v.-20';
};
  var params = new URLSearchParams(location.search);
  var url = buildUrl(params);
  if (!url) {
    document.querySelector('h1').textContent = 'Missing destination';
    document.querySelector('p').innerHTML = '<a href="/">Back to BitcoinBrainFood</a>';
  } else {
    document.getElementById('manual').href = url;
    setTimeout(function () { window.location.replace(url); }, 350);
  }
</script>
</body>
</html>
